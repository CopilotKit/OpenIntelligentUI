services:
  # ── Agent (LangGraph Python) — native Python with FastAPI + uvicorn ──
  - type: web
    name: open-generative-ui-agent
    runtime: python
    plan: starter
    rootDir: apps/agent
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 80
      targetCPUPercent: 70
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ANTHROPIC_API_KEY
        sync: false
      # OpenAI key for the default ChatGPT Instant model
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      # chat-latest and gpt-* route via OpenAI, Claude names via Anthropic.
      # The local default is an Ollama model, which Render cannot reach, so the
      # hosted demo pins OpenAI and hosted Jev (see apps/agent/src/model.py).
      - key: LLM_MODEL
        value: chat-latest
      - key: TYPESAFE_API_KEY
        sync: false
      - key: JEV_URL
        value: https://api.typesafe.ai/v1/systemone
      - key: JEV_MODEL
        value: jev-latest
    buildFilter:
      paths:
        - apps/agent/**

  # ── Frontend (Next.js) — native Node runtime ──
  - type: web
    name: open-generative-ui-app
    runtime: node
    plan: starter
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 80
      targetCPUPercent: 70
    # turbo's build task dependsOn ^build, so @repo/design-system dist/ is built before the app
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm exec turbo run build --filter=@repo/app
    startCommand: pnpm --filter @repo/app start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public origin used for social-preview metadata; existing hostname retained.
      - key: APP_URL
        value: https://opengenerativeui.copilotkit.ai
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: LANGGRAPH_DEPLOYMENT_URL
        fromService:
          name: open-generative-ui-agent
          type: web
          property: hostport
      - key: LANGSMITH_API_KEY
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "false"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "40"
      # Telemetry (docs/telemetry.md): count the hosted demo separately from self-hosted installs.
      - key: OIUI_DISTRIBUTION
        value: hosted_demo
      # PostHog project key for hosted-demo page analytics; needed at build time.
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false
    buildFilter:
      paths:
        - apps/app/**
        - packages/design-system/**
        - package.json
        - pnpm-lock.yaml
        - turbo.json
